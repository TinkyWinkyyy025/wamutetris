<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wamu Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="menuScreen" class="screen screen-active">
        <div class="brand-panel">
          <p class="eyebrow">Wamu Cafe game table</p>
          <h1>Wamu Tetris</h1>
          <p class="lede">A bright multiplayer block game for kids, families, and cafe events.</p>
        </div>

        <form id="setupForm" class="setup-panel">
          <fieldset>
            <legend>Mode</legend>
            <div class="segmented">
              <label>
                <input type="radio" name="mode" value="individual" checked />
                <span>Individual</span>
              </label>
              <label>
                <input type="radio" name="mode" value="multiplayer" />
                <span>Multiplayer</span>
              </label>
            </div>
          </fieldset>

          <div id="joinRoomField" class="room-code-field" hidden>
            <label class="field-label" for="roomCodeInput">Room Code</label>
            <input id="roomCodeInput" type="text" name="roomCode" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="off" placeholder="ABC123" />
          </div>

          <fieldset id="playerCountFieldset">
            <legend>Players</legend>
            <div class="segmented compact">
              <label>
                <input type="radio" name="players" value="2" checked />
                <span>2 pax</span>
              </label>
              <label>
                <input type="radio" name="players" value="3" />
                <span>3 pax</span>
              </label>
              <label>
                <input type="radio" name="players" value="4" />
                <span>4 pax</span>
              </label>
            </div>
          </fieldset>

          <div id="playerFields" class="player-fields"></div>

          <button id="submitButton" class="primary-button" type="submit">Start Game</button>
          <div id="roomActionButtons" class="room-action-buttons" hidden>
            <button class="primary-button" type="submit" name="roomAction" value="create">Create Room</button>
            <button class="secondary-button" type="submit" name="roomAction" value="join">Join Room</button>
          </div>
        </form>
      </section>

      <section id="gameScreen" class="screen">
        <header class="game-header">
          <div>
            <p id="modeLabel" class="eyebrow">Individual mode</p>
            <h2>Wamu Tetris</h2>
          </div>
          <div class="header-actions">
            <button id="pauseButton" class="secondary-button" type="button">Pause</button>
            <button id="menuButton" class="secondary-button" type="button">Menu</button>
          </div>
        </header>

        <div id="boards" class="boards"></div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-card">
          <p class="eyebrow">Match complete</p>
          <h2 id="winnerTitle">Winner</h2>
          <ol id="rankingList" class="ranking-list"></ol>
          <div class="result-actions">
            <button id="restartButton" class="primary-button" type="button">Restart</button>
            <button id="backButton" class="secondary-button" type="button">Back to Menu</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
