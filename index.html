<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wamu Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="menuScreen" class="screen screen-active">
        <div class="brand-panel">
          <p class="eyebrow">Wamu Cafe game table</p>
          <h1>Wamu Tetris</h1>
          <p class="lede">A bright block game for kids, families, and cafe events.</p>
        </div>

        <form id="setupForm" class="setup-panel">
          <button id="submitButton" class="primary-button" type="submit">Start Game</button>
        </form>
      </section>

      <section id="gameScreen" class="screen">
        <header class="game-header">
          <div>
            <p id="modeLabel" class="eyebrow">Individual mode</p>
            <h2>Wamu Tetris</h2>
          </div>
          <div class="header-actions">
            <button id="pauseButton" class="secondary-button" type="button">Pause</button>
            <button id="menuButton" class="secondary-button" type="button">Menu</button>
          </div>
        </header>

        <div id="boards" class="boards"></div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-card">
          <p class="eyebrow">Game over</p>
          <h2 id="winnerTitle">Winner</h2>
          <ol id="rankingList" class="ranking-list"></ol>
          <div class="result-actions">
            <button id="restartButton" class="primary-button" type="button">Restart</button>
            <button id="backButton" class="secondary-button" type="button">Back to Menu</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
